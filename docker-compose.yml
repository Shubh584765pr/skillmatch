services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillmatch
      POSTGRES_PASSWORD: skillmatch
      POSTGRES_DB: skillmatch
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: schema, then seed data.
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmatch -d skillmatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://skillmatch:skillmatch@db:5432/skillmatch
      JWT_SECRET: dev-only-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
